<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>学习bot · 数据结构</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="row">
    <div class="course"><i class="dot"></i>数据结构</div>
    <div class="countdown"><b id="daysLeft">–</b> 天后考核<span id="examDate"></span></div>
  </div>
  <div class="status">
    <div class="seg"><b id="doneCount">0/0</b><span>今天完成</span></div>
    <div class="seg"><b id="learnedMin">0</b><span>已学分钟</span></div>
    <div class="seg"><b id="capMin">120</b><span>今日容量</span></div>
  </div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="today" class="on">今天</button>
  <button data-tab="plan">计划</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
